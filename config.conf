[agent]
provider = ollama
model = gemma4-32k
temperature = 70
timeout = 120
max_iterations = 50
max_context_messages = 50
max_context_chars = 100000

[ollama]
base_url = http://localhost:11434
num_ctx = 4096
keep_alive_secs = 120

[safety]
workspace = ./
allow_network = true
max_file_size = 10485760
max_execution_time = 300

[session]
enabled = true

[server]
port = 8080
