name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Toolchain pinning policy (AGENTS.md "Environment and toolchain"):
# - backend-nix is pinned by flake.lock (nix develop).
# - The C Debian jobs pin the container to a dated sid tag, which fixes the
#   base image contents available to the job. sid is required over
#   bookworm/trixie because notcurses was removed from the Debian archive
#   for those suites; sid is the only stable-enough suite carrying
#   libnotcurses-dev 3.0.17, which the TUI targets (tui.c comments reference
#   the 3.0.17 API). The frontend job keeps the dated bookworm tag since it
#   never installs Debian packages.
# - backend-macos pins the runner to macos-15 (arm64) and installs the exact
#   formula set from Brewfile. Homebrew has no version pinning for unversioned
#   formulae (brew >= 4.4 no longer writes Brewfile.lock.json), so versions
#   float; the `brew list --versions` step records what actually ran for
#   traceability.

# - backend-arch runs the official archlinux:latest Docker Hub image, a
#   minimal `base` rootfs rebuilt daily upstream (no git/gcc/make inside —
#   those are installed explicitly; git must be installed before the
#   checkout step since actions/checkout runs inside the container). Arch
#   is a rolling release, so the toolchain cannot be version-pinned; this
#   job is the forward-compat canary that builds against the newest
#   gcc/glibc/libcurl/etc. available (notcurses is currently 3.0.17, the
#   same version the TUI targets on Debian sid). `pacman -Syu` at job start
#   closes the gap between image rebuild and live repo state, and the
#   `pacman -Q` step records the versions that actually ran for
#   traceability, same policy as backend-macos.
# - The frontend job pins Node to major 22 via actions/setup-node; exact
#   minor/patch is pinned by the committed package-lock.json (npm ci).

jobs:
  backend-debian:
    runs-on: ubuntu-latest
    container: debian:sid-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: apt-get update && apt-get install -y cmake git pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check libnotcurses-dev libunistring-dev libncurses-dev libdeflate-dev

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    - name: test
      run: ctest --test-dir build -V

    # File-size audit (AGENTS.md "Code style — File size"): non-blocking
    # report. src/main.c is currently the only file over the band and is
    # deferred by design (FILE_LENGTH_COMPLIANCE_PLAN.md N3); the step
    # flips to blocking when the audit is clean.
    - name: file-length audit
      continue-on-error: true
      run: scripts/check-file-lengths.sh

  # Release build with sanitizers still on (AGENTS.md build-flag contract:
  # sanitizers stay on in CI even for release test runs). Also exercises
  # -D_FORTIFY_SOURCE=2 under -Werror, which Debug never sees.
  backend-release:
    runs-on: ubuntu-latest
    container: debian:sid-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: apt-get update && apt-get install -y cmake git pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check libnotcurses-dev libunistring-dev libncurses-dev libdeflate-dev

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=ON

    - name: build
      run: cmake --build build

    - name: test
      run: ctest --test-dir build -V

  backend-nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v30

    - name: configure
      run: nix develop --command bash -c "cmake -B build -DCMAKE_BUILD_TYPE=Debug"

    - name: build
      run: nix develop --command bash -c "cmake --build build"

    - name: test
      run: nix develop --command bash -c "ctest --test-dir build -V"

  # Rolling-release canary: Arch has no version pins, so this job is the
  # first to break when upstream toolchains move. Mirrors backend-debian
  # (Debug + sanitizers + file-length audit) plus a version-recording step.
  backend-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    # The official archlinux image is a minimal `base` rootfs: no git (so
    # checkout below would fail), no gcc (only gcc-libs runtime), no make.
    # The keyring refresh first closes the stale-keyring window when the
    # image predates a new archlinux-keyring (Arch wiki recommendation).
    - name: update system and install git for checkout
      run: |
        pacman -Sy --noconfirm archlinux-keyring
        pacman -Syu --noconfirm
        pacman -S --noconfirm --needed git

    - uses: actions/checkout@v4

    - name: install deps
      run: pacman -S --noconfirm --needed cmake gcc make pkgconf libuv curl sqlite openssl cjson check notcurses libunistring ncurses libdeflate

    # Versions float on Arch; record what actually ran (same policy as
    # backend-macos' `brew list --versions`).
    - name: record toolchain versions
      run: pacman -Q cmake gcc git make libuv curl sqlite openssl cjson check notcurses libunistring ncurses libdeflate

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    # ASan/UBSan/LSan all work under Arch's gcc, so no ASAN_OPTIONS needed.
    - name: test
      run: ctest --test-dir build -V

    - name: file-length audit
      continue-on-error: true
      run: scripts/check-file-lengths.sh

  fuzz:
    runs-on: ubuntu-latest
    container: debian:sid-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install pinned distro toolchain
      run: apt-get update && apt-get install -y clang g++ cmake pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check libnotcurses-dev libunistring-dev libncurses-dev libdeflate-dev

    - name: configure with libFuzzer
      run: CC=clang cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug

    - name: build fuzz targets
      run: cmake --build build-fuzz --target fuzz_ollama_tool_calls fuzz_config fuzz_session_deserialize fuzz_html_extract fuzz_http_parser fuzz_openai_compatible_stream fuzz_openai_oauth_callback fuzz_openai_oauth_token fuzz_openai_oauth_jwt fuzz_openai_codex_stream fuzz_websocket_frame fuzz_ollama_parse_response fuzz_openai_parse_response fuzz_openai_parse_models fuzz_duckduckgo_html_extract fuzz_fernet_token

    - name: run bounded fuzz smoke tests
      run: |
        for target in fuzz_ollama_tool_calls fuzz_config fuzz_session_deserialize fuzz_html_extract fuzz_http_parser fuzz_openai_compatible_stream fuzz_openai_oauth_callback fuzz_openai_oauth_token fuzz_openai_oauth_jwt fuzz_openai_codex_stream fuzz_websocket_frame fuzz_ollama_parse_response fuzz_openai_parse_response fuzz_openai_parse_models fuzz_duckduckgo_html_extract fuzz_fernet_token; do
          build-fuzz/tests/$target -runs=1000 -max_len=4096
        done

  # Static-analysis gate (AGENTS.md "Static analysis"): clang-tidy +
  # cppcheck, separate from the sanitizer/test run — sanitizers only catch
  # bugs on lines a test actually runs; these catch the unexercised paths.
  # Findings are treated like a warning under -Werror: fix, or a documented
  # // TODO(reason:) exception (// NOLINT / // cppcheck-suppress), never a
  # blanket pragma.
  static-analysis:
    runs-on: ubuntu-latest
    container: debian:sid-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: apt-get update && apt-get install -y cmake git gcc clang-tidy cppcheck pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check libnotcurses-dev libunistring-dev libncurses-dev libdeflate-dev

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    - name: clang-tidy (scripts/lint.sh)
      run: scripts/lint.sh

    - name: cppcheck (scripts/cppcheck.sh)
      run: scripts/cppcheck.sh

  # TSan stage (AGENTS.md "Concurrency"): any file touching shared/global
  # state across more than one thread gets a TSan build/run. TSan is not
  # combinable with ASan/UBSan, so it is its own build dir in its own job
  # (= its own CI stage), separate from the sanitizer/test run.
  backend-tsan:
    runs-on: ubuntu-latest
    container: debian:sid-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: apt-get update && apt-get install -y cmake git gcc pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check libnotcurses-dev libunistring-dev libncurses-dev libdeflate-dev

    - name: configure (TSan only; ASan/UBSan not combinable)
      run: cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=OFF -DENABLE_TSAN=ON

    - name: build
      run: cmake --build build-tsan

    - name: test
      run: |
        # TSan on modern kernels needs ASLR off (setarch -R) or it aborts
        # with "unexpected memory mapping"; fall back to plain ctest if
        # setarch is unavailable.
        if command -v setarch >/dev/null 2>&1; then
          setarch "$(uname -m)" -R ctest --test-dir build-tsan -V
        else
          ctest --test-dir build-tsan -V
        fi

  # Verification-integrity gate (AGENTS.md "Verification discipline"):
  # - rule A (evidence): docs/verification/*.md touched by the diff must
  #   contain raw command+output, not a claim — blocking from day one.
  # - rule B (fault-injection tests): new multi-allocation functions must
  #   ship a fault-injection test in the same PR — report-only during its
  #   graduation period (dates tracked as constants in the script), the
  #   script self-surfaces the flip-to-blocking date in its output.
  verification-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: compute base ref
      id: base
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
        else
          echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
        fi

    - name: fault-injection merge gate (rule B)
      run: scripts/check-fault-tests.sh "${{ steps.base.outputs.base }}"

    - name: verification-evidence gate (rule A)
      run: scripts/check-verification-evidence.sh "${{ steps.base.outputs.base }}"

  backend-macos:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: install deps (formula set pinned by Brewfile)
      run: |
        brew update
        brew bundle --file=Brewfile

    - name: record toolchain versions
      run: brew list --versions cmake pkgconf libuv curl openssl@3 sqlite cjson check notcurses

    - name: configure
      run: |
        export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/openssl/lib/pkgconfig"
        cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    # LeakSanitizer is unsupported on macOS (AGENTS.md documents this
    # deviation); ASan/UBSan still run.
    - name: test
      run: ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build -V

  frontend:
    runs-on: ubuntu-latest
    container: debian:bookworm-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: install deps
      run: npm ci
      working-directory: frontend

    - name: lint
      run: npm run lint
      working-directory: frontend

    - name: typecheck
      run: npm run typecheck
      working-directory: frontend

    - name: test
      run: npm run test:run
      working-directory: frontend

    - name: production build
      run: npm run build
      working-directory: frontend
