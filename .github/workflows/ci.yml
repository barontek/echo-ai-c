name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Toolchain pinning policy (AGENTS.md "Environment and toolchain"):
# - backend-nix is pinned by flake.lock (nix develop).
# - Debian jobs pin the container to a dated bookworm tag, which fixes the
#   apt package versions available to the job.
# - backend-macos pins the runner to macos-15 (arm64) and installs the exact
#   formula set from Brewfile. Homebrew has no version pinning for unversioned
#   formulae (brew >= 4.4 no longer writes Brewfile.lock.json), so versions
#   float; the `brew list --versions` step records what actually ran for
#   traceability.
# - The frontend job pins Node to major 22 via actions/setup-node; exact
#   minor/patch is pinned by the committed package-lock.json (npm ci).

jobs:
  backend-debian:
    runs-on: ubuntu-latest
    container: debian:bookworm-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: apt-get update && apt-get install -y cmake git pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    - name: test
      run: ctest --test-dir build -V

  # Release build with sanitizers still on (AGENTS.md build-flag contract:
  # sanitizers stay on in CI even for release test runs). Also exercises
  # -D_FORTIFY_SOURCE=2 under -Werror, which Debug never sees.
  backend-release:
    runs-on: ubuntu-latest
    container: debian:bookworm-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: apt-get update && apt-get install -y cmake git pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=ON

    - name: build
      run: cmake --build build

    - name: test
      run: ctest --test-dir build -V

  backend-nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v30

    - name: configure
      run: nix develop --command bash -c "cmake -B build -DCMAKE_BUILD_TYPE=Debug"

    - name: build
      run: nix develop --command bash -c "cmake --build build"

    - name: test
      run: nix develop --command bash -c "ctest --test-dir build -V"

  fuzz:
    runs-on: ubuntu-latest
    container: debian:bookworm-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - name: install pinned distro toolchain
      run: apt-get update && apt-get install -y clang cmake pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check

    - name: configure with libFuzzer
      run: CC=clang cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug

    - name: build fuzz targets
      run: cmake --build build-fuzz --target fuzz_ollama_tool_calls fuzz_config fuzz_session_deserialize fuzz_html_extract fuzz_http_parser fuzz_openai_compatible_stream fuzz_openai_oauth_callback fuzz_openai_oauth_token fuzz_openai_oauth_jwt fuzz_openai_codex_stream fuzz_websocket_frame fuzz_ollama_parse_response fuzz_openai_parse_response fuzz_openai_parse_models fuzz_duckduckgo_html_extract fuzz_fernet_token

    - name: run bounded fuzz smoke tests
      run: |
        for target in fuzz_ollama_tool_calls fuzz_config fuzz_session_deserialize fuzz_html_extract fuzz_http_parser fuzz_openai_compatible_stream fuzz_openai_oauth_callback fuzz_openai_oauth_token fuzz_openai_oauth_jwt fuzz_openai_codex_stream fuzz_websocket_frame fuzz_ollama_parse_response fuzz_openai_parse_response fuzz_openai_parse_models fuzz_duckduckgo_html_extract fuzz_fernet_token; do
          build-fuzz/tests/$target -runs=1000 -max_len=4096
        done

  backend-macos:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: install deps (formula set pinned by Brewfile)
      run: |
        brew update
        brew bundle --file=Brewfile

    - name: record toolchain versions
      run: brew list --versions cmake pkgconf libuv curl openssl@3 sqlite cjson check

    - name: configure
      run: |
        export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/openssl/lib/pkgconfig"
        cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    # LeakSanitizer is unsupported on macOS (AGENTS.md documents this
    # deviation); ASan/UBSan still run.
    - name: test
      run: ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build -V

  frontend:
    runs-on: ubuntu-latest
    container: debian:bookworm-20260803-slim

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: install deps
      run: npm ci
      working-directory: frontend

    - name: lint
      run: npm run lint
      working-directory: frontend

    - name: typecheck
      run: npm run typecheck
      working-directory: frontend

    - name: test
      run: npm run test:run
      working-directory: frontend

    - name: production build
      run: npm run build
      working-directory: frontend
