name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend-debian:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: apt-get update && apt-get install -y cmake pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    - name: test
      run: ctest --test-dir build -V

  backend-nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: configure
      run: nix develop --command bash -c "cmake -B build -DCMAKE_BUILD_TYPE=Debug"

    - name: build
      run: nix develop --command bash -c "cmake --build build"

    - name: test
      run: nix develop --command bash -c "ctest --test-dir build -V"

  oauth-fuzz:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim

    steps:
    - uses: actions/checkout@v4

    - name: install pinned distro toolchain
      run: apt-get update && apt-get install -y clang cmake pkgconf pkg-config libuv1-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev libcjson-dev check

    - name: configure with libFuzzer
      run: CC=clang cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug

    - name: build OAuth and Codex fuzz targets
      run: cmake --build build-fuzz --target fuzz_openai_oauth_callback fuzz_openai_oauth_token fuzz_openai_oauth_jwt fuzz_openai_codex_stream

    - name: run bounded fuzz smoke tests
      run: |
        build-fuzz/tests/fuzz_openai_oauth_callback -runs=1000
        build-fuzz/tests/fuzz_openai_oauth_token -runs=1000
        build-fuzz/tests/fuzz_openai_oauth_jwt -runs=1000
        build-fuzz/tests/fuzz_openai_codex_stream -runs=1000

  backend-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: install deps
      run: brew install cmake pkg-config libuv curl openssl sqlite cjson check

    - name: configure
      run: |
        export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/openssl/lib/pkgconfig"
        cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build

    - name: test
      run: ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build -V

  frontend:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim

    steps:
    - uses: actions/checkout@v4

    - name: install Node.js 22
      run: |
        apt-get update && apt-get install -y curl
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y nodejs

    - name: install deps
      run: npm ci
      working-directory: frontend

    - name: lint
      run: npm run lint
      working-directory: frontend

    - name: typecheck
      run: npm run typecheck
      working-directory: frontend

    - name: test
      run: npm run test:run
      working-directory: frontend

    - name: production build
      run: npm run build
      working-directory: frontend
